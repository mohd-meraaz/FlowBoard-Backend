server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: AuthFilter
              args:
                excludedPaths: >
                  /api/v1/auth/register,
                  /api/v1/auth/login,
                  /api/v1/auth/refresh,
                  /api/v1/auth/validate,
                  /api/v1/auth/verify-email,
                  /api/v1/auth/resend-verification,
                  /api/v1/auth/forgot-password,
                  /api/v1/auth/reset-password

            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@authRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        - id: oauth2-login
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/oauth2/**,/login/oauth2/**

        - id: workspace-service
          uri: lb://WORKSPACE-SERVICE
          predicates:
            - Path=/api/v1/workspaces/**
          filters:
            - name: AuthFilter
              args:
                excludedPaths: /api/v1/workspaces/public
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@defaultRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        - id: board-service
          uri: lb://BOARD-SERVICE
          predicates:
            - Path=/api/v1/boards/**
          filters:
            - name: AuthFilter
              args:
                excludedPaths: /api/v1/boards/public
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@defaultRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        - id: list-service
          uri: lb://LIST-SERVICE
          predicates:
            - Path=/api/v1/lists/**
          filters:
            - name: AuthFilter
              args:
                excludedPaths: ""
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@defaultRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        - id: card-service
          uri: lb://CARD-SERVICE
          predicates:
            - Path=/api/v1/cards/**
          filters:
            - name: AuthFilter
              args:
                excludedPaths: ""
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@defaultRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: AuthFilter
              args:
                excludedPaths: ""
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@defaultRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: AuthFilter
              args:
                excludedPaths: /api/v1/payments/plans,/api/v1/payments/webhook

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

jwt:
  secret: ${JWT_SECRET:}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.flowBoard: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
